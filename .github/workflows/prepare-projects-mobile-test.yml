name: Prepare isolated project mobile photos
on:
  push:
    branches: [test/projects-mobile-webp-20261022]
    paths: [tools/prepare_projects_mobile.py, tests/mobile-photo-sources.json, .github/workflows/prepare-projects-mobile-test.yml]
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/projects-mobile-webp-20261022
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=11,<13'
      - run: python tools/prepare_projects_mobile.py
      - run: node tests/check-projects-mobile.cjs
      - name: Save mobile assets in test branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/*/mobile/ projects/*/mobile-thumbs/ tests/mobile-photo-sizes.json
          if ! git diff --cached --quiet; then
            git commit -m "test: generate mobile project photos and thumbnails"
            git push origin HEAD:test/projects-mobile-webp-20261022
          fi

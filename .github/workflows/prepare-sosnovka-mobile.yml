name: Prepare mobile photos test (Sosnovka 47)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=11,<13'
      - run: python tools/prepare_sosnovka_mobile.py
      - name: Commit test images only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/sosnovka-47/mobile/
          if ! git diff --cached --quiet; then
            git commit -m "test: add optimized mobile Sosnovka 47 gallery images"
            git push
          fi

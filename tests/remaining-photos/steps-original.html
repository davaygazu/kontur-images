.ks7-controls{margin-top:22px;padding-top:0}

.ks7-step.on{background:var(--g);border-color:var(--g);color:#fff}

.ks7-bottom{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-top:0}

.ks7-track{height:2px;background:#e6eae8;flex:1;overflow:hidden}

.ks7-fill{height:100%;background:var(--g);width:11.111%;transition:width .4s}

.ks7-arrow:hover{border-color:var(--g)}

.ks7-vis{position:relative;background:#f4f7f5;overflow:hidden}

.ks7-scene{padding:0!important}

.ks7-scene img{width:100%;height:100%;object-fit:contain;object-position:center center;display:block}

#ks7 .ks7-scene:after{content:"";display:block!important;position:absolute;inset:0;left:0;right:0;bottom:0;height:auto;background:linear-gradient(180deg,rgba(9,96,65,.01),rgba(9,96,65,.055));filter:none;pointer-events:none}

.ks7-a{fill:none;stroke:var(--g);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

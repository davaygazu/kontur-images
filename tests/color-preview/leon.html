<script>
'use strict';const lightToggle=document.querySelector('.window-toggle');lightToggle.addEventListener('click',()=>{const on=lightToggle.getAttribute('aria-checked')!=='true';lightToggle.setAttribute('aria-checked',String(on));lightToggle.querySelector('.light-label').textContent=on?'Включён':'Выключен';document.querySelector('.photo').classList.toggle('lights-on',on);});

const img=document.getElementById('source'),canvas=document.getElementById('paint'),ctx=canvas.getContext('2d'),buttons=[...document.querySelectorAll('.color:not(.roof-color)')],reset=document.getElementById('reset');const roofButtons=[...document.querySelectorAll('.roof-color')];let source,mask,roofMask,woodColor=null,roofColor=null,ready=false;

function init(){if(ready)return;ready=true;try{const w=1080,h=810;canvas.width=w;canvas.height=h;const raw=document.createElement('canvas');raw.width=w;raw.height=h;const rc=raw.getContext('2d');rc.drawImage(img,0,0,w,h);source=rc.getImageData(0,0,w,h);const mc=document.createElement('canvas');mc.width=w;mc.height=h;const c=mc.getContext('2d');c.fillStyle='#fff';
// Leon facade and veranda; window frames and glass are excluded.
polygon(c,[[110, 338], [306, 251], [310, 228], [515, 132], [724, 226], [718, 251], [1062, 389], [975, 429], [975, 646], [200, 646], [200, 375]]);c.globalCompositeOperation="destination-out";const holes=[[[263, 326], [379, 278], [380, 444], [263, 443]], [[422, 228], [511, 188], [511, 433], [423, 432]], [[525, 188], [613, 226], [613, 433], [525, 433]], [[661, 278], [780, 326], [780, 442], [660, 442]], [[262, 455], [382, 455], [382, 646], [262, 646]], [[422, 448], [513, 448], [513, 649], [422, 649]], [[525, 448], [614, 448], [614, 649], [525, 649]], [[662, 454], [782, 454], [782, 647], [662, 647]], [[847, 403], [952, 403], [952, 644], [847, 644]], [[116, 344], [194, 375], [194, 396], [116, 351]], [[389, 287], [397, 287], [396, 651], [382, 671], [376, 669], [387, 649]], [[643, 288], [654, 285], [651, 654], [641, 654]]];holes.forEach(p=>polygon(c,p));mask=c.getImageData(0,0,w,h).data;c.clearRect(0,0,w,h);c.globalCompositeOperation="source-over";polygon(c,[[101, 318], [303, 232], [310, 251], [113, 340]]);polygon(c,[[291, 204], [510, 99], [522, 99], [739, 204], [731, 226], [515, 128], [303, 228]]);polygon(c,[[734, 225], [1076, 367], [1070, 388], [723, 247]]);roofMask=c.getImageData(0,0,w,h).data;
// Exclude blue sky along the roof ridge from the roof overlay.
for(let i=0;i<roofMask.length;i+=4){if(source.data[i+2]>source.data[i+1]+8)roofMask[i+3]=0;}
const sky=document.getElementById('sunset-sky');sky.width=w;sky.height=h;const sc=sky.getContext('2d'),sd=sc.createImageData(w,h);for(let y=0;y<Math.min(h,565);y++){const t=Math.min(1,y/550),top=[107,119,157],bottom=[239,175,143];for(let x=0;x<w;x++){const ridge=x<304?318+(x-101)*(232-318)/203:x<515?204+(x-291)*(99-204)/224:x<739?99+(x-515)*(204-99)/224:225+(x-734)*(367-225)/342;if(x>=200&&x<=847&&y>=ridge-3)continue;const i=(y*w+x)*4,r=source.data[i],g=source.data[i+1],b=source.data[i+2];const a=Math.max(0,Math.min(1,(b-g-10)/28))*Math.max(0,Math.min(1,(g-r-12)/28));if(!a)continue;for(let k=0;k<3;k++)sd.data[i+k]=top[k]*(1-t)+bottom[k]*t;sd.data[i+3]=Math.round(a*255);}}sc.putImageData(sd,0,0);
roofButtons.forEach(b=>b.disabled=false);buttons.forEach(b=>b.disabled=false);reset.disabled=false;}catch(e){document.getElementById('error').hidden=false;document.getElementById('error').textContent='Не удалось подготовить цвета. Обновите страницу.';}}
function paint(){const out=ctx.createImageData(source.width,source.height),s=source.data,d=out.data;for(let i=0;i<s.length;i+=4){const isRoof=roofColor&&roofMask[i+3],rgb=isRoof?roofColor:woodColor,alpha=isRoof?roofMask[i+3]:mask[i+3];if(!rgb||!alpha)continue;const luminance=.2126*s[i]+.7152*s[i+1]+.0722*s[i+2],light=Math.pow(luminance/(isRoof?65:110),.9);d[i]=Math.min(255,rgb[0]*light);d[i+1]=Math.min(255,rgb[1]*light);d[i+2]=Math.min(255,rgb[2]*light);d[i+3]=alpha;}ctx.putImageData(out,0,0);}

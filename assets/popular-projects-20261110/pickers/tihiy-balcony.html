function mask(polys,holes=[]){const scale=4,mc=document.createElement('canvas');mc.width=canvas.width*scale;mc.height=canvas.height*scale;const c=mc.getContext('2d');c.fillStyle='#fff';polys.forEach(p=>polygon(c,p,mc.width,mc.height));c.globalCompositeOperation='destination-out';holes.forEach(p=>polygon(c,p,mc.width,mc.height));const small=document.createElement('canvas');small.width=canvas.width;small.height=canvas.height;const sc=small.getContext('2d');sc.imageSmoothingEnabled=true;sc.imageSmoothingQuality='high';sc.drawImage(mc,0,0,small.width,small.height);return sc.getImageData(0,0,small.width,small.height).data;}
const clamp=x=>Math.max(0,Math.min(1,x));
function paint(){if(!source)return;const out=ctx.createImageData(source.width,source.height),s=source.data,d=out.data;const lights=true;
for(let i=0;i<s.length;i+=4){let r=s[i],g=s[i+1],b=s[i+2],lum=.2126*r+.7152*g+.0722*b;const rw=roofColor&&roof[i+3]/255;const ww=woodColor&&wall[i+3]/255;
 if(rw){const a=rw,shade=.35+.65*Math.pow(Math.max(0,lum/160),.7);r=r*(1-a)+Math.min(255,roofColor[0]*shade)*a;g=g*(1-a)+Math.min(255,roofColor[1]*shade)*a;b=b*(1-a)+Math.min(255,roofColor[2]*shade)*a;}
 else if(ww){const a=ww,shade=Math.pow(Math.max(.04,lum/config.base),.82);r=r*(1-a)+Math.min(255,woodColor[0]*shade)*a;g=g*(1-a)+Math.min(255,woodColor[1]*shade)*a;b=b*(1-a)+Math.min(255,woodColor[2]*shade)*a;}
 if(!lights&&config.sourceLights&&glass[i+3]){const f=glass[i+3]/255;const grey=.3*r+.48*g+.22*b;r=r*(1-f)+grey*.55*f;g=g*(1-f)+grey*.61*f;b=b*(1-f)+grey*.68*f;}
 d[i]=r;d[i+1]=g;d[i+2]=b;d[i+3]=255;
}ctx.putImageData(out,0,0);}
function init(){if(ready)return;ready=true;try{canvas.width=Math.min(1440,img.naturalWidth);canvas.height=Math.round(canvas.width*img.naturalHeight/img.naturalWidth);ctx.drawImage(img,0,0,canvas.width,canvas.height);source=ctx.getImageData(0,0,canvas.width,canvas.height);wall=mask(config.walls,config.holes);roof=mask(config.roof);glass=mask(config.glass);buttons.concat(roofButtons).forEach(b=>b.disabled=false);reset.disabled=false;paint();}catch(e){const er=document.getElementById('error');er.hidden=false;er.textContent='Не удалось загрузить подбор цвета. Попробуйте ещё раз.';}}
function bind(group,isRoof){group.forEach(b=>b.addEventListener('click',()=>{const color=b.dataset.color.split(',').map(Number);if(isRoof)roofColor=color;else woodColor=color;group.forEach(x=>x.setAttribute('aria-pressed',String(x===b)));document.getElementById(isRoof?'roof-chosen':'chosen').textContent=b.getAttribute('aria-label');paint();}));}bind(buttons,false);bind(roofButtons,true);
document.querySelectorAll('.time-btn').forEach(b=>b.addEventListener('click',()=>{photo.classList.toggle('is-evening',b.dataset.time==='evening');document.querySelectorAll('.time-btn').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));}));
reset.addEventListener('click',()=>{woodColor=null;roofColor=null;ctx.putImageData(source,0,0);buttons.concat(roofButtons).forEach(b=>b.setAttribute('aria-pressed','false'));document.getElementById('chosen').textContent='Исходный цвет';document.getElementById('roof-chosen').textContent='Исходный цвет';});
img.addEventListener('load',init);if(img.complete&&img.naturalWidth)init();
new ResizeObserver(()=>parent.postMessage({type:'kontur-color-height',height:document.body.getBoundingClientRect().height},'*')).observe(document.body);
</script><script>(function(){document.querySelectorAll('.colors').forEach(row=>{let down=false,moved=false,x=0,scroll=0,id;row.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse'||e.button!==0)return;down=true;moved=false;x=e.clientX;scroll=row.scrollLeft;id=e.pointerId;});row.addEventListener('pointermove',e=>{if(!down)return;const d=e.clientX-x;if(!moved&&Math.abs(d)<5)return;moved=true;row.setPointerCapture(id);row.classList.add('is-dragging');e.preventDefault();row.scrollLeft=scroll-d;});function end(){down=false;row.classList.remove('is-dragging');}row.addEventListener('pointerup',end);row.addEventListener('pointercancel',end);row.addEventListener('click',e=>{if(moved&&e.detail){e.preventDefault();e.stopImmediatePropagation();moved=false;}},true);row.addEventListener('dragstart',e=>e.preventDefault());});})();</script><script>document.querySelector('.window-toggle')?.closest('.time-row')?.remove();document.querySelector('.window-glow')?.remove();</script></body></html>

reset.addEventListener('click',()=>{woodColor=null;roofColor=null;ctx.putImageData(source,0,0);buttons.concat(roofButtons).forEach(b=>b.setAttribute('aria-pressed','false'));document.getElementById('chosen').textContent='Исходный цвет';document.getElementById('roof-chosen').textContent='Исходный цвет';});
img.addEventListener('load',init);if(img.complete&&img.naturalWidth)init();
new ResizeObserver(()=>parent.postMessage({type:'kontur-color-height',height:document.body.getBoundingClientRect().height},'*')).observe(document.body);
</script><script>(function(){document.querySelectorAll('.colors').forEach(row=>{let down=false,moved=false,x=0,scroll=0,id;row.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse'||e.button!==0)return;down=true;moved=false;x=e.clientX;scroll=row.scrollLeft;id=e.pointerId;});row.addEventListener('pointermove',e=>{if(!down)return;const d=e.clientX-x;if(!moved&&Math.abs(d)<5)return;moved=true;row.setPointerCapture(id);row.classList.add('is-dragging');e.preventDefault();row.scrollLeft=scroll-d;});function end(){down=false;row.classList.remove('is-dragging');}row.addEventListener('pointerup',end);row.addEventListener('pointercancel',end);row.addEventListener('click',e=>{if(moved&&e.detail){e.preventDefault();e.stopImmediatePropagation();moved=false;}},true);row.addEventListener('dragstart',e=>e.preventDefault());});})();</script><script>document.querySelector('.window-toggle')?.closest('.time-row')?.remove();document.querySelector('.window-glow')?.remove();</script></body></html>
